# Canonical team-name aliases — validated by code review.
#
# One of two human-validation channels for scraped team names. Entries here
# ship with the image and are reviewed like any other code change; aliases
# approved by an admin at runtime live in the Supabase `team_aliases` table
# instead. Both are consulted; neither is guessed.
#
# Keys are the *scraped* spelling — FlashScore, openfootball for the `EU-*`
# scopes, or football-data.org's `shortName` for the live results board —
# values the *canonical* football-data.co.uk spelling used by every model and
# data set here. Matching ignores case and surrounding whitespace.
# An alias whose value is not a real team is rejected at resolution time and
# flagged by `tests/teams/test_static_alias_repository.py`.
#
# Two kinds of key appear here:
#
#   P1, E0, ...   a league code; the alias applies within that league
#   EU-POR, ...   a *country* scope for UEFA competitions, so one approval
#                 covers the Champions, Europa and Conference Leagues alike
#
# The `EU-*` entries below are generated — approve names in the admin panel or
# `scripts/review_team_names.py`, then run:
#
#     uv run python scripts/export_team_aliases.py
#
# and commit the result. That export is not optional bookkeeping: CI is given
# no Supabase credentials, so this file is the only route by which approved
# aliases reach training. Without it the cross-league ELO calibration silently
# does nothing. See docs/european-competitions.md §10.
#
# Every mapping is verified by a human against the registry before it lands —
# nothing here is inferred from similarity.
