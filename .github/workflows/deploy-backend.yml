name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "src/backend/**"
      - "src/models/**"
      - "src/analysis/**"
      - "src/scrapers/**"
      - "src/evaluation/**"
      - "config/**"
      - "pyproject.toml"
      - "Dockerfile"
  workflow_dispatch:

jobs:
  deploy:
    name: Build → Push → Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name (lowercase)
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Trigger Render redeploy
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          IMAGE_URL="${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${RENDER_DEPLOY_HOOK_URL}&imgURL=${IMAGE_URL}")
          echo "Render deploy hook response: $HTTP_STATUS (image: $IMAGE_URL)"
          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "201" ]; then
            echo "::error::Render deploy hook returned $HTTP_STATUS"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Backend Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`$REGISTRY/$IMAGE_NAME:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
