# Deploy combined backend + frontend service to Render.
#
# Flow: build Docker image (Python API + React static) → push to ghcr.io → trigger Render deploy hook.
#
# ── One-time Render setup ──────────────────────────────────────────────────────
# 1. Run this workflow manually first (Actions → Deploy → Run workflow)
# 2. Create a single Web Service on Render:
#      Image URL: ghcr.io/<github-org>/football-prediction-agent:latest
#      Registry credentials: GitHub
#      Port: 8000
#      Health check path: /api/status (or /)
# 3. Copy the Deploy Hook URL → set as GitHub secret RENDER_DEPLOY_HOOK_URL
# 4. Set the following environment variables on the Render service:
#      CORS_ORIGINS=*  (or a specific domain)
#      SUPABASE_URL, SUPABASE_SERVICE_KEY, RETRAIN_API_KEY, etc.
# 5. Remove the old backend and frontend Render services.
# ───────────────────────────────────────────────────────────────────────────────

name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/backend/**"
      - "src/frontend/**"
      - "config/**"
      - "pyproject.toml"
      - "Dockerfile"
  workflow_dispatch:

jobs:
  deploy:
    name: Build → Push → Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name (lowercase)
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Trigger Render redeploy
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -1)
          echo "Render deploy hook status: $HTTP_STATUS"
          echo "Render deploy hook body: $HTTP_BODY"
          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "201" ] && [ "$HTTP_STATUS" != "202" ]; then
            echo "::error::Render deploy hook returned $HTTP_STATUS — $HTTP_BODY"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`$REGISTRY/$IMAGE_NAME:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
