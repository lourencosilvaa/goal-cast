name: Retrain & Deploy Model

on:
  # ── Manual trigger ────────────────────────────────────────────────────────
  workflow_dispatch:
    inputs:
      force:
        description: "Force retraining even if model is up to date"
        type: boolean
        default: false

  # ── Scheduled: every Monday at 06:00 UTC (after weekend fixtures settle) ──
  schedule:
    - cron: "0 6 * * 1"

jobs:
  retrain:
    name: Train → Upload → Redeploy
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
      BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
      RETRAIN_API_KEY: ${{ secrets.RETRAIN_API_KEY }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python + uv ──────────────────────────────────────────────
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --no-dev

      # ── 3. Signal retraining start ─────────────────────────────────────────
      - name: Set retraining flag (start)
        if: ${{ env.BACKEND_URL != '' && env.RETRAIN_API_KEY != '' }}
        run: |
          curl -s -X POST "$BACKEND_URL/api/retrain-status" \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: $RETRAIN_API_KEY" \
            -d '{"retraining": true}' || echo "WARNING: could not set retrain flag"

      # ── 4. Train model ─────────────────────────────────────────────────────
      # Sets the `retrained` step output (true/false). When there is no new
      # data (and no force), training is skipped and retrained=false, so the
      # upload + redeploy steps below are skipped too — no needless redeploy.
      - name: Train model
        id: train
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          uv run python scripts/train_model.py $FORCE_FLAG

      # ── 5. Upload artefacts to Hugging Face Hub ────────────────────────────
      - name: Upload model to Hugging Face Hub
        if: ${{ steps.train.outputs.retrained == 'true' }}
        run: uv run python scripts/upload_to_hf.py

      # ── 5b. Restart the HF Space so it reloads the new dataset snapshot ────
      # The Space reads its match history once, at boot. Without this restart it
      # keeps serving the snapshot it started with, so freshly uploaded results
      # never reach the UI. Failure here is fatal on purpose: silent staleness
      # is exactly the failure mode this step exists to prevent.
      - name: Restart HuggingFace Space
        if: ${{ steps.train.outputs.retrained == 'true' }}
        env:
          HF_SPACE_REPO_ID: ${{ secrets.HF_SPACE_REPO_ID }}
        run: uv run python scripts/restart_hf_space.py

      # ── 6. Trigger Render redeploy (backend restarts and downloads new model from HF) ──
      - name: Trigger Render redeploy
        if: ${{ steps.train.outputs.retrained == 'true' && env.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$RENDER_DEPLOY_HOOK_URL")
          echo "Render deploy hook response: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "201" ] && [ "$HTTP_STATUS" != "202" ]; then
            echo "WARNING: Render deploy hook returned $HTTP_STATUS"
          fi

      # ── 8. Clear retraining flag (new backend will serve latest model) ──────
      - name: Clear retraining flag (done)
        if: ${{ always() && env.BACKEND_URL != '' && env.RETRAIN_API_KEY != '' }}
        run: |
          curl -s -X POST "$BACKEND_URL/api/retrain-status" \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: $RETRAIN_API_KEY" \
            -d '{"retraining": false}' || echo "WARNING: could not clear retrain flag"

      # ── 9. Summary ─────────────────────────────────────────────────────────
      - name: Print summary
        if: always()
        run: |
          echo "## Retrain Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Repo:** \`$HF_REPO_ID\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Run:** ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.train.outputs.retrained }}" = "true" ]; then
            echo "- **Retrained:** yes — uploaded + redeployed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Retrained:** no — model already up to date, skipped upload/redeploy" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f output/models/training_results.json ]; then
            echo "- **Training results:** found ✓" >> $GITHUB_STEP_SUMMARY
          fi
