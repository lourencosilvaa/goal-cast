name: Run Inference & Upload Predictions

on:
  # ── Daily at 06:30 UTC (after retrain at 06:00 if Monday) ──
  schedule:
    - cron: "30 6 * * *"

  # ── Manual trigger ──
  workflow_dispatch:
    inputs:
      date:
        description: "Target date DD/MM/YYYY (blank = all fixture dates)"
        type: string
        default: ""
      leagues:
        description: "Comma-separated league codes (blank = all)"
        type: string
        default: ""

  # ── After model retrain completes ──
  workflow_run:
    workflows: ["Retrain & Deploy Model"]
    types: [completed]

jobs:
  inference:
    name: Predict → Upload to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      # Upcoming European fixtures. Without these every provider skips itself
      # and the run discovers zero fixtures — which used to be silent. With
      # european.required set it now fails instead, so both secrets must exist
      # under Settings -> Secrets and variables -> Actions.
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      # Inference must build ELO from exactly the same corpus training did. A
      # fixture's elo_home is read from that team's last historical row, so
      # serving ratings computed without the European results to a model
      # trained with them is worse than never calibrating — the features stop
      # meaning what the model learned, and nothing fails loudly. The cache is
      # gitignored, so it has to be rebuilt here.
      - name: Build European corpus
        run: uv run python scripts/build_european_corpus.py

      - name: Run inference
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date '${{ github.event.inputs.date }}'"
          fi
          if [ -n "${{ github.event.inputs.leagues }}" ]; then
            ARGS="$ARGS --leagues '${{ github.event.inputs.leagues }}'"
          fi
          eval uv run python scripts/run_inference.py $ARGS

      - name: Summary
        if: always()
        run: |
          echo "## Inference Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Date filter:** ${{ github.event.inputs.date || 'all' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **League filter:** ${{ github.event.inputs.leagues || 'all' }}" >> $GITHUB_STEP_SUMMARY
