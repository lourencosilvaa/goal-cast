name: Run Inference & Upload Predictions

on:
  # ── Daily at 06:30 UTC (after retrain at 06:00 if Monday) ──
  schedule:
    - cron: "30 6 * * *"

  # ── Manual trigger ──
  workflow_dispatch:
    inputs:
      date:
        description: "Target date DD/MM/YYYY (blank = all fixture dates)"
        type: string
        default: ""
      leagues:
        description: "Comma-separated league codes (blank = all)"
        type: string
        default: ""

  # ── After model retrain completes ──
  workflow_run:
    workflows: ["Retrain & Deploy Model"]
    types: [completed]

jobs:
  inference:
    name: Predict → Upload to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - name: Run inference
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date '${{ github.event.inputs.date }}'"
          fi
          if [ -n "${{ github.event.inputs.leagues }}" ]; then
            ARGS="$ARGS --leagues '${{ github.event.inputs.leagues }}'"
          fi
          eval uv run python scripts/run_inference.py $ARGS

      - name: Summary
        if: always()
        run: |
          echo "## Inference Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Date filter:** ${{ github.event.inputs.date || 'all' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **League filter:** ${{ github.event.inputs.leagues || 'all' }}" >> $GITHUB_STEP_SUMMARY
