    - "2526"
    - "2425"
    - "2324"
    - "2223"
    - "2122"
    - "2021"
    - "1920"
    - "1819"
    - "1718"
  leagues:
    E0: "Premier League"
    E1: "Championship"
    E2: "League One"
    E3: "League Two"
    SC0: "Scottish Premiership"
    SC1: "Scottish Championship"
    SC2: "Scottish League One"
    SC3: "Scottish League Two"
    SP1: "La Liga"
    SP2: "La Liga 2"
    D1: "Bundesliga"
    D2: "2. Bundesliga"
    I1: "Serie A"
    I2: "Serie B"
    F1: "Ligue 1"
    F2: "Ligue 2"
    N1: "Eredivisie"
    B1: "Jupiler Pro League"
    P1: "Liga Portugal"
    T1: "Super Lig"
    G1: "Super League Greece"
  columns_to_keep:
