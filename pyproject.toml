[project]
name = "football-prediction-agent"
version = "0.1.0"
description = "Football match prediction system combining ML models with Portuguese betting odds scraping for value bet detection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "google-genai>=1.0.0",
    "supabase>=2.29.0",
    "huggingface-hub>=1.12.0",
    "cryptography>=46.0.7",
    "python-dotenv>=1.0.0",
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "joblib>=1.3.0",
    "openpyxl>=3.1.5",
    "pyarrow>=24.0.0",
]

[dependency-groups]
backend = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "supabase>=2.29.0",
    "google-genai>=1.0.0",
    "huggingface-hub>=1.12.0",
    "cryptography>=46.0.7",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]
ml = [
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "joblib>=1.3.0",
    "openpyxl>=3.1.5",
    "pyarrow>=24.0.0",
]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=1.2.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
    "mypy>=1.18.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "ipykernel>=7.2.0",
    "pandas-stubs>=2.0.0",
    "types-requests>=2.31.0",
    "types-PyYAML>=6.0.0",
    "types-beautifulsoup4>=4.12.0",
    "types-seaborn>=0.13.0",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
